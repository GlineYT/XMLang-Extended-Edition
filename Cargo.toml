[package]
name = "xmlang-ee"
version = "1.1.0" 
edition = "2021"
authors = ["Gameline <your-email@example.com>"]
description = "XMLang Extended Edition - A fork of the XML-based esoteric programming language"
license = "MIT"
repository = "https://github.com/yourusername/xmlang-ee"

[profile.release]
opt-level = 3          # Maximum optimization
lto = true             # Link-time optimization (smaller, faster)
codegen-units = 1      # Better optimization
strip = true           # Remove debug symbols
panic = "abort"        # Smaller panic handler

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

xmltree = "0.10.3"
thiserror = "1.0.40"
substring = "1.4.5" # UTF-8 is hard
rand = "0.8.5"
uuid = { version = "1.0", features = ["v4", "fast-rng"] }
radix_fmt = "1.0.0"
md5 = "0.7"
sha2 = "0.10"
bcrypt = "0.15"
hmac = "0.12"
